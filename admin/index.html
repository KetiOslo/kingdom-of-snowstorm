<!DOCTYPE html>

  <title>Kingdom of Snowstorm | Keystatic Admin</title>

  <script type="module">

    import ReactDOM from 'https://esm.sh/react-dom@18/client';
    import { makePage } from 'https://esm.sh/@keystatic/core/ui/app';
    import keystaticConfig from './keystatic.config.ts';

    ReactDOM.createRoot(document.getElementById('root')).render(
      React.createElement(makePage({ config: keystaticConfig }))
    );
  </script>
</body>
</html>
