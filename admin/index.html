<!DOCTYPE html>
<html lang="mk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kingdom of Snowstorm | Master Admin</title>
  <style>
    :root { --primary: #0284c7; --primary-dark: #0369a1; --success: #16a34a; --bg: #f1f5f9; --card: #ffffff; --text: #1e293b; --border: #cbd5e1; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .wrapper { max-width: 1000px; margin: 0 auto; background: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
    h1 { color: var(--primary); font-size: 24px; margin-top: 0; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .auth-box { background: #f0f9ff; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #bae6fd; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .auth-box input { flex: 1; min-width: 250px; margin: 0; }
    .tabs { display: flex; gap: 8px; margin-bottom: 25px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; flex-wrap: wrap; }
    .tab-btn { background: #e2e8f0; border: none; padding: 10px 16px; font-weight: 600; border-radius: 6px; cursor: pointer; color: #475569; transition: all 0.2s; }
    .tab-btn.active { background: var(--primary); color: white; }
    .tab-content { display: none; animation: fadeIn 0.3s ease; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    label { font-weight: 600; display: block; margin-top: 15px; font-size: 14px; color: #475569; }
    input[type="text"], input[type="password"], input[type="date"], textarea, select { width: 100%; padding: 10px 12px; margin-top: 6px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    input:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1); }
    textarea { height: 110px; resize: vertical; }
    .btn { background: var(--primary); color: white; border: none; padding: 12px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; margin-top: 20px; transition: background 0.2s; }
    .btn:hover { background: var(--primary-dark); }
    .btn-secondary { background: #10b981; }
    .btn-secondary:hover { background: #059669; }
    .item-card { background: #f8fafc; border: 1px solid var(--border); padding: 20px; border-radius: 8px; margin-bottom: 20px; position: relative; }
    .remove-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; position: absolute; top: 20px; right: 20px; font-size: 12px; font-weight: bold; }
    .remove-btn:hover { background: #dc2626; }
    .status { margin-top: 15px; font-weight: 600; font-size: 14px; padding: 10px; border-radius: 6px; display: none; }
    .status.success { background: #dcfce7; color: var(--success); display: block; }
    .status.error { background: #fee2e2; color: #ef4444; display: block; }
    .status.loading { background: #e0f2fe; color: var(--primary); display: block; }
    .file-upload-box { margin-top: 6px; background: #fff; padding: 10px; border: 1px dashed var(--border); border-radius: 6px; }
  </style>
</head>
<body>

<div class="wrapper">
  <h1>
    <span>👑 Kingdom of Snowstorm - Master Admin</span>
    <span style="font-size: 13px; font-weight: normal; color: #64748b;">Блог & Содржина</span>
  </h1>
  
  <!-- ПОВРЗУВАЊЕ СО GITHUB -->
  <div class="auth-box">
    <div style="flex: 1; min-width: 250px;">
      <label style="margin-top: 0;">GitHub Personal Access Token:</label>
      <input type="password" id="gh-token" placeholder="ghp_..." onchange="saveToken()" />
    </div>
    <div style="margin-top: 20px;">
      <button class="btn" style="margin-top: 0; padding: 10px 15px;" onclick="saveToken()">Запомни токен</button>
    </div>
    <div id="auth-status" style="width: 100%; font-size: 13px; font-weight: 600; color: var(--success);"></div>
  </div>

  <!-- Табови за навигација -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('home', event)">🏠 Почетна</button>
    <button class="tab-btn" onclick="switchTab('about', event)">📖 За нас</button>
    <button class="tab-btn" onclick="switchTab('settings', event)">⚙️ Поставки</button>
    <button class="tab-btn" onclick="switchTab('gallery', event)">📸 Галерија</button>
    <button class="tab-btn" onclick="switchTab('blog', event)" style="background: #0284c7; color: white;">📝 Блог</button>
  </div>

  <!-- 1. ПОЧЕТНА -->
  <div id="home" class="tab-content active">
    <h3>Уредување на Почетна страница</h3>
    <label>Главен наслов (hero_title):</label>
    <input type="text" id="h_title" />

    <label>Воведен текст (hero_desc):</label>
    <textarea id="h_desc"></textarea>

    <label>Наслов на кутија (box_title):</label>
    <input type="text" id="h_box_title" />

    <label>Опис на кутија (box_desc):</label>
    <textarea id="h_box_desc"></textarea>
    
    <button class="btn" onclick="saveFile('content/home.json', getHomeData(), 'home.msg')">Зачувај на GitHub</button>
    <div id="home.msg" class="status"></div>
  </div>

  <!-- 2. ЗА НАС -->
  <div id="about" class="tab-content">
    <h3>Уредување на За нас страница</h3>
    <label>Пасус 1 (p1):</label>
    <textarea id="a_p1"></textarea>

    <label>Пасус 2 (p2):</label>
    <textarea id="a_p2"></textarea>

    <label>Цитат (quote):</label>
    <textarea id="a_quote"></textarea>

    <button class="btn" onclick="saveFile('content/about.json', getAboutData(), 'about.msg')">Зачувај на GitHub</button>
    <div id="about.msg" class="status"></div>
  </div>

  <!-- 3. ПОСТАВКИ -->
  <div id="settings" class="tab-content">
    <h3>Општи информации</h3>
    <label>Локација (location):</label>
    <input type="text" id="s_location" />

    <label>Телефон (phone):</label>
    <input type="text" id="s_phone" />

    <label>Е-пошта (email):</label>
    <input type="text" id="s_email" />

    <label>Facebook Линк (facebook_url):</label>
    <input type="text" id="s_fb" />

    <button class="btn" onclick="saveFile('content/settings.json', getSettingsData(), 'settings.msg')">Зачувај на GitHub</button>
    <div id="settings.msg" class="status"></div>
  </div>

  <!-- 4. ГАЛЕРИЈА -->
  <div id="gallery" class="tab-content">
    <h3>Уредување на Галерија</h3>
    <div id="gallery-container"></div>
    <button class="btn btn-secondary" onclick="addGalleryItem()">+ Додај слика</button>
    <br><br>
    <button class="btn" onclick="saveFile('content/gallery.json', { items: galleryData }, 'gallery.msg')">Зачувај на GitHub</button>
    <div id="gallery.msg" class="status"></div>
  </div>

  <!-- 5. БЛОГ -->
  <div id="blog" class="tab-content">
    <h3>📝 Уредување и Водење на Блог Објави</h3>
    <div id="blog-container"></div>
    <button class="btn btn-secondary" onclick="addBlogPost()">+ Креирај нов блог пост</button>
    <br><br>
    <button class="btn" onclick="saveFile('content/blog.json', { posts: blogData }, 'blog.msg')">Зачувај ги блог објавите на GitHub</button>
    <div id="blog.msg" class="status"></div>
  </div>

</div>

<script>
  let galleryData = [];
  let blogData = [];
  const repo = 'KetiOslo/kingdom-of-snowstorm';

  function saveToken() {
    const t = document.getElementById('gh-token').value.trim();
    if(t) {
      localStorage.setItem('gh_token', t);
      document.getElementById('auth-status').innerText = '✓ Токенот е зачуван!';
    }
  }

  window.addEventListener('DOMContentLoaded', async () => {
    const savedT = localStorage.getItem('gh_token');
    if(savedT) {
      document.getElementById('gh-token').value = savedT;
      document.getElementById('auth-status').innerText = '✓ Поврзано со GitHub.';
    }

    try {
      // Home
      const rH = await fetch('../content/home.json');
      if(rH.ok) {
        const d = await rH.json();
        document.getElementById('h_title').value = d.hero_title || '';
        document.getElementById('h_desc').value = d.hero_desc || '';
        document.getElementById('h_box_title').value = d.box_title || '';
        document.getElementById('h_box_desc').value = d.box_desc || '';
      }

      // About
      const rA = await fetch('../content/about.json');
      if(rA.ok) {
        const d = await rA.json();
        document.getElementById('a_p1').value = d.p1 || '';
        document.getElementById('a_p2').value = d.p2 || '';
        document.getElementById('a_quote').value = d.quote || '';
      }

      // Settings
      const rS = await fetch('../content/settings.json');
      if(rS.ok) {
        const d = await rS.json();
        document.getElementById('s_location').value = d.location || '';
        document.getElementById('s_phone').value = d.phone || '';
        document.getElementById('s_email').value = d.email || '';
        document.getElementById('s_fb').value = d.facebook_url || '';
      }

      // Gallery
      const rG = await fetch('../content/gallery.json');
      if(rG.ok) {
        const d = await rG.json();
        galleryData = d.items || [];
        renderGallery();
      }

      // Blog
      const rB = await fetch('../content/blog.json');
      if(rB.ok) {
        const d = await rB.json();
        blogData = d.posts || [];
        renderBlog();
      }
    } catch(e) { console.log("Ready"); }
  });

  function switchTab(tabId, event) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    if(event) event.currentTarget.classList.add('active');
  }

  // Аплоуд на слика директно на GitHub
  async function uploadImageToGithub(fileInput, targetInputId) {
    const file = fileInput.files[0];
    if(!file) return;
    const token = localStorage.getItem('gh_token') || document.getElementById('gh-token').value.trim();
    if(!token) { alert('Внесете токен најгоре!'); return; }

    const reader = new FileReader();
    reader.onload = async function(e) {
      const base64Content = e.target.result.split(',')[1];
      const fileName = Date.now() + '_' + file.name.replace(/\s+/g, '_');
      const filePath = `content/images/${fileName}`;
      alert('Сликата се прикачува...');

      try {
        const res = await fetch(`https://api.github.com/repos/${repo}/contents/${filePath}`, {
          method: 'PUT',
          headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: `Upload ${fileName}`, content: base64Content })
        });
        if(res.ok) {
          document.getElementById(targetInputId).value = `/content/images/${fileName}`;
          alert('✓ Сликата е успешно поставена!');
        } else { alert('✕ Грешка при прикачување.'); }
      } catch(err) { alert('✕ Мрежна грешка.'); }
    };
    reader.readAsDataURL(file);
  }

  // Gallery
  function renderGallery() {
    const container = document.getElementById('gallery-container');
    container.innerHTML = '';
    galleryData.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = 'item-card';
      div.innerHTML = `
        <button class="remove-btn" onclick="galleryData.splice(${index},1); renderGallery();">Избриши</button>
        <label>Наслов:</label>
        <input type="text" value="${item.title || ''}" onchange="galleryData[${index}].title = this.value">
        <label>Категорија:</label>
        <select onchange="galleryData[${index}].category = this.value">
          <option value="Shows" ${item.category === 'Shows' ? 'selected' : ''}>Shows</option>
          <option value="Home Life" ${item.category === 'Home Life' ? 'selected' : ''}>Home Life</option>
          <option value="Puppies" ${item.category === 'Puppies' ? 'selected' : ''}>Puppies</option>
          <option value="Grooming" ${item.category === 'Grooming' ? 'selected' : ''}>Grooming</option>
        </select>
        <label>Слика:</label>
        <input type="text" id="gal_${index}" value="${item.image || ''}" onchange="galleryData[${index}].image = this.value">
        <div class="file-upload-box"><input type="file" accept="image/*" onchange="uploadImageToGithub(this, 'gal_${index}'); galleryData[${index}].image = document.getElementById('gal_${index}').value;"></div>
        <label>Опис:</label>
        <textarea style="height:50px;" onchange="galleryData[${index}].caption = this.value">${item.caption || ''}</textarea>
      `;
      container.appendChild(div);
    });
  }
  function addGalleryItem() { galleryData.push({ title: "Нова слика", category: "Shows", image: "", caption: "" }); renderGallery(); }

  // Blog Management
  function renderBlog() {
    const container = document.getElementById('blog-container');
    container.innerHTML = '';
    blogData.forEach((post, index) => {
      const div = document.createElement('div');
      div.className = 'item-card';
      div.innerHTML = `
        <button class="remove-btn" onclick="blogData.splice(${index},1); renderBlog();">Избриши пост</button>
        <label>Наслов на блогот:</label>
        <input type="text" value="${post.title || ''}" onchange="blogData[${index}].title = this.value">
        <label>Датум:</label>
        <input type="date" value="${post.date || ''}" onchange="blogData[${index}].date = this.value" style="width:100%; padding:10px; margin-top:6px; border:1px solid var(--border); border-radius:6px;">
        <label>Главна слика на блогот:</label>
        <input type="text" id="blog_img_${index}" value="${post.image || ''}" onchange="blogData[${index}].image = this.value">
        <div class="file-upload-box"><input type="file" accept="image/*" onchange="uploadImageToGithub(this, 'blog_img_${index}'); blogData[${index}].image = document.getElementById('blog_img_${index}').value;"></div>
        <label>Краток опис (Excerpt):</label>
        <textarea style="height:60px;" onchange="blogData[${index}].excerpt = this.value">${post.excerpt || ''}</textarea>
        <label>Целосна содржина на блогот (Текст):</label>
        <textarea style="height:150px;" onchange="blogData[${index}].content = this.value">${post.content || ''}</textarea>
      `;
      container.appendChild(div);
    });
  }
  function addBlogPost() {
    const today = new Date().toISOString().split('T')[0];
    blogData.unshift({ title: "Нов наслов на блог", date: today, image: "", excerpt: "", content: "" });
    renderBlog();
  }

  // Data Getters
  function getHomeData() {
    return {
      hero_title: document.getElementById('h_title').value,
      hero_desc: document.getElementById('h_desc').value,
      box_title: document.getElementById('h_box_title').value,
      box_desc: document.getElementById('h_box_desc').value,
      val1_title: "Врвен квалитет", val1_desc: "Меѓународни шампионски линии.",
      val2_title: "Здравствена сигурност", val2_desc: "Генетски тестирани кучиња.",
      val3_title: "Правилна исхрана", val3_desc: "Одгледани со домашна и природна храна."
    };
  }
  function getAboutData() {
    return { p1: document.getElementById('a_p1').value, p2: document.getElementById('a_p2').value, quote: document.getElementById('a_quote').value };
  }
  function getSettingsData() {
    return { location: document.getElementById('s_location').value, phone: document.getElementById('s_phone').value, email: document.getElementById('s_email').value, facebook_url: document.getElementById('s_fb').value, footer_desc: "Lifetime with Labradors." };
  }

  // Generic Save Function
  async function saveFile(filePath, jsonData, msgId) {
    const token = localStorage.getItem('gh_token') || document.getElementById('gh-token').value.trim();
    const statusEl = document.getElementById(msgId);
    if(!token) { alert('Внесете токен најгоре!'); return; }

    statusEl.className = 'status loading';
    statusEl.innerText = '⏳ Се синхронизира со GitHub...';

    try {
      const getRes = await fetch(`https://api.github.com/repos/${repo}/contents/${filePath}`, {
        headers: { 'Authorization': `token ${token}` }
      });
      let sha = getRes.ok ? (await getRes.json()).sha : '';

      const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(jsonData, null, 2))));
      const putRes = await fetch(`https://api.github.com/repos/${repo}/contents/${filePath}`, {
        method: 'PUT',
        headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: `Update ${filePath}`, content: contentBase64, sha: sha })
      });

      if(putRes.ok) {
        statusEl.className = 'status success';
        statusEl.innerText = '✓ Успешно зачувано и објавено!';
        setTimeout(() => statusEl.style.display = 'none', 4000);
      } else {
        statusEl.className = 'status error';
        statusEl.innerText = '✕ Грешка при зачувување.';
      }
    } catch(err) {
      statusEl.className = 'status error';
      statusEl.innerText = '✕ Мрежна грешка.';
    }
  }
</script>

</body>
</html>
