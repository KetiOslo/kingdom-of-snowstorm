<!DOCTYPE html>
<html lang="mk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kingdom of Snowstorm | Professional Admin</title>
  <style>
    :root { --primary: #0284c7; --primary-dark: #0369a1; --success: #16a34a; --bg: #f1f5f9; --card: #ffffff; --text: #1e293b; --border: #cbd5e1; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .wrapper { max-width: 1100px; margin: 0 auto; background: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
    h1 { color: var(--primary); font-size: 24px; margin-top: 0; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .auth-box { background: #f0f9ff; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #bae6fd; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .auth-box input { flex: 1; min-width: 250px; margin: 0; }
    .tabs { display: flex; gap: 6px; margin-bottom: 25px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; flex-wrap: wrap; }
    .tab-btn { background: #e2e8f0; border: none; padding: 9px 14px; font-weight: 600; border-radius: 6px; cursor: pointer; color: #475569; transition: all 0.2s; font-size: 13px; }
    .tab-btn.active { background: var(--primary); color: white; }
    .tab-content { display: none; animation: fadeIn 0.3s ease; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    label { font-weight: 600; display: block; margin-top: 15px; font-size: 14px; color: #475569; }
    
    input[type="text"], input[type="password"], input[type="date"], select, textarea { width: 100%; padding: 10px 12px; margin-top: 6px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 14px; font-family: inherit; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1); }
    textarea { resize: vertical; min-height: 42px; line-height: 1.5; }

    .lang-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-top: 10px; position: relative; }
    .lang-box h4 { margin: 0 0 8px 0; font-size: 13px; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 5px; }
    
    .translate-btn { background: #10b981; color: white; border: none; padding: 3px 8px; font-size: 11px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .translate-btn:hover { background: #059669; }
    .translate-btn-alt { background: #0284c7; }
    .translate-btn-alt:hover { background: #0369a1; }

    .editor-wrapper { margin-top: 6px; border: 2px solid var(--border); border-radius: 8px; overflow: hidden; background: #fff; }
    .editor-toolbar { background: #e2e8f0; border-bottom: 1px solid var(--border); padding: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
    .editor-toolbar button { background: #ffffff; border: 1px solid #94a3b8; border-radius: 4px; padding: 6px 12px; font-weight: bold; cursor: pointer; color: #1e293b; font-size: 13px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .editor-toolbar button:hover { background: var(--primary); color: white; border-color: var(--primary); }
    .editor-content { min-height: 110px; max-height: 250px; overflow-y: auto; padding: 12px; outline: none; font-size: 14px; line-height: 1.6; background: #ffffff; color: #0f172a; }
    .editor-content:focus { background: #f8fafc; }

    .btn { background: var(--primary); color: white; border: none; padding: 12px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; margin-top: 20px; transition: background 0.2s; }
    .btn:hover { background: var(--primary-dark); }
    .btn-secondary { background: #10b981; }
    .btn-secondary:hover { background: #059669; }
    .item-card { background: #f8fafc; border: 1px solid var(--border); padding: 20px; border-radius: 8px; margin-bottom: 20px; position: relative; }
    .remove-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; position: absolute; top: 20px; right: 20px; font-size: 12px; font-weight: bold; }
    .remove-btn:hover { background: #dc2626; }
    .status { margin-top: 15px; font-weight: 600; font-size: 14px; padding: 10px; border-radius: 6px; display: none; }
    .status.success { background: #dcfce7; color: var(--success); display: block; }
    .status.error { background: #fee2e2; color: #ef4444; display: block; }
    .status.loading { background: #e0f2fe; color: var(--primary); display: block; }
    .file-upload-box { margin-top: 6px; background: #fff; padding: 10px; border: 1px dashed var(--border); border-radius: 6px; }

    .image-preview-area { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    .image-chip { position: relative; width: 70px; height: 70px; border-radius: 6px; overflow: hidden; border: 2px solid var(--border); background: #e2e8f0; }
    .image-chip img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .image-chip .del-img-btn { position: absolute; top: 2px; right: 2px; background: rgba(239, 68, 68, 0.9); color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 10px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .image-chip .del-img-btn:hover { background: #dc2626; }
    .hidden-image-input { display: none !important; }
  </style>
</head>
<body>

<div class="wrapper">
  <h1>
    <span>👑 Kingdom of Snowstorm - Professional Admin</span>
  </h1>
  
  <div class="auth-box">
    <div style="flex: 1; min-width: 250px;">
      <label style="margin-top: 0;">GitHub Personal Access Token:</label>
      <input type="password" id="gh-token" placeholder="ghp_..." onchange="saveToken()" />
    </div>
    <div style="margin-top: 20px;">
      <button class="btn" style="margin-top: 0; padding: 10px 15px;" onclick="saveToken()">Запомни токен</button>
    </div>
    <div id="auth-status" style="width: 100%; font-size: 13px; font-weight: 600; color: var(--success);"></div>
  </div>

  <div class="tabs">
    <button class="tab-btn" onclick="switchTab('home', event)">🏠 Почетна</button>
    <button class="tab-btn" onclick="switchTab('about', event)">📖 За нас</button>
    <button class="tab-btn" onclick="switchTab('settings', event)">⚙️ Поставки</button>
    <button class="tab-btn" onclick="switchTab('gallery', event)">📸 Галерија</button>
    <button class="tab-btn" onclick="switchTab('dogs', event)">🐶 Кучиња</button>
    <button class="tab-btn" onclick="switchTab('litters', event)">🍼 Легла (Litters)</button>
    <button class="tab-btn" onclick="switchTab('puppies', event)">🐾 Достапни</button>
    <button class="tab-btn active" onclick="switchTab('blog', event)">📝 Блог</button>
  </div>

  <div id="home" class="tab-content"><h3>Почетна</h3><button class="btn" onclick="saveFile('content/home.json', {}, 'home.msg')">Зачувај на GitHub</button><div id="home.msg" class="status"></div></div>
  <div id="about" class="tab-content"><h3>За нас</h3><button class="btn" onclick="saveFile('content/about.json', {}, 'about.msg')">Зачувај на GitHub</button><div id="about.msg" class="status"></div></div>
  <div id="settings" class="tab-content"><h3>Поставки</h3><button class="btn" onclick="saveFile('content/settings.json', {}, 'settings.msg')">Зачувај на GitHub</button><div id="settings.msg" class="status"></div></div>
  <div id="gallery" class="tab-content"><h3>Галерија</h3><button class="btn" onclick="saveFile('content/gallery.json', {}, 'gallery.msg')">Зачувај на GitHub</button><div id="gallery.msg" class="status"></div></div>
  <div id="dogs" class="tab-content"><h3>Кучиња</h3><button class="btn" onclick="saveFile('content/dogs.json', {}, 'dogs.msg')">Зачувај на GitHub</button><div id="dogs.msg" class="status"></div></div>
  <div id="litters" class="tab-content"><h3>Легла</h3><button class="btn" onclick="saveFile('content/litters.json', {}, 'litters.msg')">Зачувај на GitHub</button><div id="litters.msg" class="status"></div></div>
  <div id="puppies" class="tab-content"><h3>Достапни</h3><button class="btn" onclick="saveFile('content/puppies.json', {}, 'puppies.msg')">Зачувај на GitHub</button><div id="puppies.msg" class="status"></div></div>

  <!-- 8. БЛОГ -->
  <div id="blog" class="tab-content active">
    <h3 style="margin-top:0; border-bottom: 2px solid var(--primary); padding-bottom: 10px;">📝 Управување со Блог објави</h3>
    <p style="font-size: 14px; color: #475569; margin-bottom: 25px;">
      Секоја објава има <strong>Основна маска</strong> (главна слика и воведен текст) и опција за <strong>Дополнителни полиња</strong> каде што додаваш слики кои стојат над подолг текст.
    </p>
    
    <div id="blog-container"></div>
    <button class="btn btn-secondary" onclick="addBlogPost()" style="width: 100%; justify-content: center; font-size: 16px;">+ Креирај нова Блог објава</button>
    <br><br><hr style="border: 1px solid #e2e8f0; margin: 25px 0;"><br>
    <button class="btn" style="width:100%; justify-content:center; font-size:18px;" onclick="saveFile('content/blog.json', { posts: blogData }, 'blog.msg')">Зачувај ги сите објави на GitHub</button>
    <div id="blog.msg" class="status"></div>
  </div>

</div>

<script>
  let blogData = [];
  const repo = 'KetiOslo/kingdom-of-snowstorm';

  function nl2br(str) { return str ? str.toString().replace(/\n/g, '<br>') : ''; }
  function br2nl(str) { return str ? str.toString().replace(/<br\s*\/?>/gi, '\n') : ''; }

  function saveToken() {
    const t = document.getElementById('gh-token').value.trim();
    if(t) { localStorage.setItem('gh_token', t); document.getElementById('auth-status').innerText = '✓ Токенот е зачуван!'; }
  }

  function formatText(containerId, command) {
    const el = document.getElementById(containerId);
    if(el) {
      el.focus();
      document.execCommand(command, false, null);
    }
  }

  function resolveImagePath(path) {
    let cleanPath = path.toString().trim();
    if (!cleanPath) return '';
    if (cleanPath.startsWith('http')) return cleanPath;
    if (cleanPath.startsWith('/')) cleanPath = cleanPath.substring(1);
    if (cleanPath.startsWith('content/images/')) return '../' + cleanPath;
    if (cleanPath.startsWith('content/')) return '../' + cleanPath;
    if (cleanPath.startsWith('images/')) return '../content/' + cleanPath;
    return '../content/images/' + cleanPath;
  }

  function renderImagePreviews(inputId, previewBoxId) {
    const inputEl = document.getElementById(inputId);
    const previewBox = document.getElementById(previewBoxId);
    if(!inputEl || !previewBox) return;

    const val = inputEl.value.trim();
    previewBox.innerHTML = '';
    
    if(val) {
      const paths = val.split(',').map(s=>s.trim()).filter(Boolean);
      paths.forEach((path, idx) => {
        const fullUrl = resolveImagePath(path);
        previewBox.innerHTML += `
          <div class="image-chip">
            <img src="${fullUrl}" alt="img" onerror="this.style.display='none'">
            <button class="del-img-btn" onclick="removeImage('${inputId}', '${previewBoxId}', ${idx})" title="Избриши слика">X</button>
          </div>
        `;
      });
    }
  }

  function removeImage(inputId, previewBoxId, indexToRemove) {
    const inputEl = document.getElementById(inputId);
    const val = inputEl.value.trim();
    if(val) {
      let paths = val.split(',').map(s=>s.trim()).filter(Boolean);
      paths.splice(indexToRemove, 1);
      inputEl.value = paths.join(', ');
      triggerFieldUpdates();
      renderImagePreviews(inputId, previewBoxId);
    }
  }

  window.addEventListener('DOMContentLoaded', async () => {
    const savedT = localStorage.getItem('gh_token');
    if(savedT) { document.getElementById('gh-token').value = savedT; document.getElementById('auth-status').innerText = '✓ Поврзано со GitHub.'; }
    
    try {
      const res = await fetch(`../content/blog.json?t=` + new Date().getTime());
      if(res.ok) { 
        const d = await res.json(); 
        blogData = d.posts || d.items || []; 
        renderBlog(); 
      }
    } catch(e) { console.log("Blog Load Error"); }
  });

  function switchTab(tabId, event) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    if(event) event.currentTarget.classList.add('active');
  }

  async function uploadMultipleImagesToGithub(fileInput, targetInputId, previewBoxId) {
    const files = fileInput.files;
    if(!files || files.length === 0) return;
    const token = localStorage.getItem('gh_token') || document.getElementById('gh-token').value.trim();
    if(!token) { alert('Внесете токен најгоре!'); return; }

    const box = fileInput.closest('.file-upload-box');
    let statusInfo = box.querySelector('.upload-status');
    if(!statusInfo) {
      statusInfo = document.createElement('div');
      statusInfo.className = 'upload-status';
      statusInfo.style.fontSize = '12px';
      statusInfo.style.color = '#0284c7';
      statusInfo.style.marginTop = '5px';
      box.appendChild(statusInfo);
    }
    statusInfo.innerText = `⏳ Се прикачуваат ${files.length} слика(и)...`;

    let uploadedPaths = [];
    const currentInputValue = document.getElementById(targetInputId).value.trim();
    if(currentInputValue) {
      uploadedPaths = currentInputValue.split(',').map(s => s.trim()).filter(Boolean);
    }

    try {
      for(let i = 0; i < files.length; i++) {
        const file = files[i];
        const base64Content = await toBase64(file);
        const fileName = Date.now() + '_' + i + '_' + file.name.replace(/\s+/g, '_');
        const filePath = `content/images/${fileName}`;

        const res = await fetch(`https://api.github.com/repos/${repo}/contents/${filePath}`, {
          method: 'PUT',
          headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: `Upload ${fileName}`, content: base64Content })
        });

        if(res.ok) {
          uploadedPaths.push(`content/images/${fileName}`);
        }
        await new Promise(r => setTimeout(r, 400));
      }

      document.getElementById(targetInputId).value = uploadedPaths.join(', ');
      triggerFieldUpdates();
      renderImagePreviews(targetInputId, previewBoxId);
      statusInfo.innerText = '✓ Успешно прикачени!';
      setTimeout(() => statusInfo.innerText='', 3000);
      fileInput.value = "";
    } catch(err) {
      statusInfo.innerText = '✕ Грешка при прикачување.';
      alert('✕ Грешка при прикачување на сликите.');
    }
  }

  function toBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = error => reject(error);
    });
  }

  /* === БЛОГ ФУНКЦИИ === */
  function renderBlog() {
    const c = document.getElementById('blog-container'); 
    c.innerHTML = '';
    
    blogData.forEach((post, i) => {
      if(!post.rows) post.rows = [];

      // Рендерирање на додатните редови (слика + текст)
      let rowsHtml = '';
      post.rows.forEach((row, rIdx) => {
        rowsHtml += `
          <div style="background: #ffffff; border: 1px dashed var(--border); padding: 15px; border-radius: 6px; margin-top: 15px;" id="blog_row_${i}_${rIdx}">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 12px;">
              <strong style="color: var(--primary-dark);">Дополнително поле #${rIdx + 1} (Слика над текст)</strong>
              <button type="button" class="remove-btn" style="position:static;" onclick="removeBlogRow(${i}, ${rIdx})">Избриши поле</button>
            </div>
            
            <label>Поднаслов на полето (опционално):</label>
            <div class="lang-row" style="margin-top:5px;">
              <div class="lang-box"><h4>🇲🇰 МК <button type="button" class="translate-btn translate-btn-alt" onclick="autoTranslate('blog_row_t_en_${i}_${rIdx}', 'blog_row_t_mk_${i}_${rIdx}', 'en', 'mk')">EN➔MK 🤖</button></h4><textarea rows="1" id="blog_row_t_mk_${i}_${rIdx}">${br2nl(row.title_mk || '')}</textarea></div>
              <div class="lang-box"><h4>🇬🇧 EN <button type="button" class="translate-btn" onclick="autoTranslate('blog_row_t_mk_${i}_${rIdx}', 'blog_row_t_en_${i}_${rIdx}', 'mk', 'en')">MK➔EN 🤖</button></h4><textarea rows="1" id="blog_row_t_en_${i}_${rIdx}">${br2nl(row.title_en || '')}</textarea></div>
            </div>

            <label>📸 Слика за ова поле (ќе стои НАД текстот):</label>
            <input type="text" id="blog_row_img_${i}_${rIdx}" value="${row.image || ''}" class="hidden-image-input">
            <div id="blog_row_prev_${i}_${rIdx}" class="image-preview-area"></div>
            <div class="file-upload-box"><input type="file" accept="image/*" multiple onchange="uploadMultipleImagesToGithub(this, 'blog_row_img_${i}_${rIdx}', 'blog_row_prev_${i}_${rIdx}')"></div>

            <label>📝 Текст на полето (МК / EN):</label>
            <div class="lang-row" style="margin-top:5px;">
              <div class="lang-box">
                <h4>🇲🇰 МК <button type="button" class="translate-btn translate-btn-alt" onclick="autoTranslate('blog_row_txt_en_${i}_${rIdx}', 'blog_row_txt_mk_${i}_${rIdx}', 'en', 'mk')">EN➔MK 🤖</button></h4>
                <div class="editor-wrapper"><div class="editor-toolbar"><button type="button" onclick="formatText('blog_row_txt_mk_${i}_${rIdx}', 'bold')"><b>B</b></button><button type="button" onclick="formatText('blog_row_txt_mk_${i}_${rIdx}', 'italic')"><i>I</i></button></div>
                <div id="blog_row_txt_mk_${i}_${rIdx}" class="editor-content" contenteditable="true">${row.text_mk || ''}</div></div>
              </div>
              <div class="lang-box">
                <h4>🇬🇧 EN <button type="button" class="translate-btn" onclick="autoTranslate('blog_row_txt_mk_${i}_${rIdx}', 'blog_row_txt_en_${i}_${rIdx}', 'mk', 'en')">MK➔EN 🤖</button></h4>
                <div class="editor-wrapper"><div class="editor-toolbar"><button type="button" onclick="formatText('blog_row_txt_en_${i}_${rIdx}', 'bold')"><b>B</b></button><button type="button" onclick="formatText('blog_row_txt_en_${i}_${rIdx}', 'italic')"><i>I</i></button></div>
                <div id="blog_row_txt_en_${i}_${rIdx}" class="editor-content" contenteditable="true">${row.text_en || ''}</div></div>
              </div>
            </div>
          </div>
        `;
      });

      // Главна картичка за блог постот
      c.innerHTML += `<div class="item-card" style="padding-top: 50px;">
        <button class="remove-btn" onclick="blogData.splice(${i},1); renderBlog();" style="top: 10px; right: 10px; font-size: 14px;">🗑 Избриши ја цела објава</button>
        
        <div style="background: #e0f2fe; padding: 15px; border-radius: 8px; border: 1px solid #bae6fd; margin-bottom: 25px;">
          <h4 style="margin-top:0; color:var(--primary-dark); font-size: 16px;">📌 ОСНОВНА МАСКА (Главен наслов, вовед и слика)</h4>
          
          <label>Главен наслов на статија (МК / EN):</label>
          <div class="lang-row">
            <div class="lang-box"><h4>🇲🇰 МК <button type="button" class="translate-btn translate-btn-alt" onclick="autoTranslate('blog_t_en_${i}', 'blog_t_mk_${i}', 'en', 'mk')">EN➔MK 🤖</button></h4><textarea id="blog_t_mk_${i}" rows="2">${br2nl(post.title_mk || post.title || '')}</textarea></div>
            <div class="lang-box"><h4>🇬🇧 EN <button type="button" class="translate-btn" onclick="autoTranslate('blog_t_mk_${i}', 'blog_t_en_${i}', 'mk', 'en')">MK➔EN 🤖</button></h4><textarea id="blog_t_en_${i}" rows="2">${br2nl(post.title_en || '')}</textarea></div>
          </div>

          <label>Датум на објава:</label>
          <input type="date" id="blog_date_${i}" value="${post.date || ''}" style="width:100%; padding:10px; margin-top:6px; border:1px solid var(--border); border-radius:6px;">
          
          <label>📸 Главна слика (Најгоре во статијата):</label>
          <input type="text" id="blog_${i}" value="${post.image || ''}" class="hidden-image-input">
          <div id="blog_preview_${i}" class="image-preview-area"></div>
          <div class="file-upload-box"><input type="file" accept="image/*" multiple onchange="uploadMultipleImagesToGithub(this, 'blog_${i}', 'blog_preview_${i}')"></div>
          
          <label>Краток опис (Само за во мрежата од 4 картички на сајтот - МК / EN):</label>
          <div class="lang-row">
            <div class="lang-box"><h4>🇲🇰 МК <button type="button" class="translate-btn translate-btn-alt" onclick="autoTranslate('blog_exc_en_${i}', 'blog_exc_mk_${i}', 'en', 'mk')">EN➔MK 🤖</button></h4>
              <div class="editor-wrapper"><div class="editor-toolbar"><button type="button" onclick="formatText('blog_exc_mk_${i}', 'bold')"><b>B</b></button></div><div id="blog_exc_mk_${i}" class="editor-content" contenteditable="true">${post.excerpt_mk || post.excerpt || ''}</div></div>
            </div>
            <div class="lang-box"><h4>🇬🇧 EN <button type="button" class="translate-btn" onclick="autoTranslate('blog_exc_mk_${i}', 'blog_exc_en_${i}', 'mk', 'en')">MK➔EN 🤖</button></h4>
              <div class="editor-wrapper"><div class="editor-toolbar"><button type="button" onclick="formatText('blog_exc_en_${i}', 'bold')"><b>B</b></button></div><div id="blog_exc_en_${i}" class="editor-content" contenteditable="true">${post.excerpt_en || ''}</div></div>
            </div>
          </div>

          <label>📝 Главен воведен текст на статијата (МК / EN):</label>
          <div class="lang-row">
            <div class="lang-box"><h4>🇲🇰 МК <button type="button" class="translate-btn translate-btn-alt" onclick="autoTranslate('blog_cont_en_${i}', 'blog_cont_mk_${i}', 'en', 'mk')">EN➔MK 🤖</button></h4>
              <div class="editor-wrapper"><div class="editor-toolbar"><button type="button" onclick="formatText('blog_cont_mk_${i}', 'bold')"><b>B</b></button></div><div id="blog_cont_mk_${i}" class="editor-content" contenteditable="true">${post.content_mk || post.content || ''}</div></div>
            </div>
            <div class="lang-box"><h4>🇬🇧 EN <button type="button" class="translate-btn" onclick="autoTranslate('blog_cont_mk_${i}', 'blog_cont_en_${i}', 'mk', 'en')">MK➔EN 🤖</button></h4>
              <div class="editor-wrapper"><div class="editor-toolbar"><button type="button" onclick="formatText('blog_cont_en_${i}', 'bold')"><b>B</b></button></div><div id="blog_cont_en_${i}" class="editor-content" contenteditable="true">${post.content_en || ''}</div></div>
            </div>
          </div>
        </div>

        <div style="padding: 15px; background: #f8fafc; border-radius: 8px; border: 1px dashed var(--border);">
          <h4 style="margin:0 0 10px 0; color:var(--primary-dark); font-size: 16px;">🧩 ДОПОЛНИТЕЛНИ ПОЛИЊА ВО СТАТИЈАТА</h4>
          <p style="font-size:13px; color:#475569; margin:0 0 15px 0;">Тука можеш да додаваш неограничен број дополнителни параграфи каде сликата ќе стои најгоре, а текстот под неа.</p>
          <div id="blog_rows_box_${i}">${rowsHtml}</div>
          <button type="button" class="btn btn-secondary" style="margin-top:15px; width: 100%; justify-content: center;" onclick="addBlogRow(${i})">+ Додај дополнително поле (Слика + Текст)</button>
        </div>
      </div>`;
      
      // Иницијализација на прегледот за сите слики
      setTimeout(() => {
        renderImagePreviews(`blog_${i}`, `blog_preview_${i}`);
        if(post.rows) {
          post.rows.forEach((row, rIdx) => {
            renderImagePreviews(`blog_row_img_${i}_${rIdx}`, `blog_row_prev_${i}_${rIdx}`);
          });
        }
      }, 50);
    });
  }

  function addBlogPost() {
    const today = new Date().toISOString().split('T')[0];
    blogData.unshift({ title_mk: "", title_en: "", date: today, image: "", excerpt_mk: "", excerpt_en: "", content_mk: "", content_en: "", rows: [] });
    renderBlog();
  }

  function addBlogRow(postIndex) {
    triggerFieldUpdates(); 
    if(!blogData[postIndex].rows) blogData[postIndex].rows = [];
    blogData[postIndex].rows.push({ title_mk: "", title_en: "", text_mk: "", text_en: "", image: "" });
    renderBlog();
  }

  function removeBlogRow(postIndex, rowIndex) {
    triggerFieldUpdates();
    blogData[postIndex].rows.splice(rowIndex, 1);
    renderBlog();
  }

  /* СУПЕР ВАЖНО: Функција која ги собира сите податоци пред зачувување и пред ререндерирање */
  function triggerFieldUpdates() {
    document.querySelectorAll('#blog-container .item-card').forEach((card, i) => {
      if(!blogData[i]) return;
      blogData[i].title_mk = nl2br(document.getElementById(`blog_t_mk_${i}`)?.value || '');
      blogData[i].title_en = nl2br(document.getElementById(`blog_t_en_${i}`)?.value || '');
      blogData[i].date = document.getElementById(`blog_date_${i}`)?.value || blogData[i].date;
      blogData[i].image = document.getElementById(`blog_${i}`)?.value || '';
      
      blogData[i].excerpt_mk = document.getElementById(`blog_exc_mk_${i}`)?.innerHTML || '';
      blogData[i].excerpt_en = document.getElementById(`blog_exc_en_${i}`)?.innerHTML || '';
      blogData[i].content_mk = document.getElementById(`blog_cont_mk_${i}`)?.innerHTML || '';
      blogData[i].content_en = document.getElementById(`blog_cont_en_${i}`)?.innerHTML || '';

      if(blogData[i].rows) {
        blogData[i].rows.forEach((row, rIdx) => {
          row.title_mk = nl2br(document.getElementById(`blog_row_t_mk_${i}_${rIdx}`)?.value || '');
          row.title_en = nl2br(document.getElementById(`blog_row_t_en_${i}_${rIdx}`)?.value || '');
          row.image = document.getElementById(`blog_row_img_${i}_${rIdx}`)?.value || '';
          row.text_mk = document.getElementById(`blog_row_txt_mk_${i}_${rIdx}`)?.innerHTML || '';
          row.text_en = document.getElementById(`blog_row_txt_en_${i}_${rIdx}`)?.innerHTML || '';
        });
      }
    });
  }

  async function autoTranslate(sourceId, targetId, fromLang, toLang) {
    const sourceEl = document.getElementById(sourceId);
    const targetEl = document.getElementById(targetId);
    if(!sourceEl || !targetEl) return;

    let text = sourceEl.tagName === 'TEXTAREA' ? sourceEl.value : sourceEl.innerHTML;
    let cleanText = text.replace(/<[^>]*>?/gm, '').trim();
    if(!cleanText) {
      alert('Нема текст за преведување!');
      return;
    }

    const btn = event.currentTarget;
    const origText = btn.innerText;
    btn.innerText = 'Се преведува...';
    btn.disabled = true;

    try {
      const chunkSize = 450;
      let chunks = [];
      for (let i = 0; i < cleanText.length; i += chunkSize) {
        chunks.push(cleanText.substring(i, i + chunkSize));
      }

      let translatedChunks = [];
      for (let chunk of chunks) {
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(chunk)}&langpair=${fromLang}|${toLang}&de=kingdomofsnowstorm@gmail.com`);
        const data = await res.json();
        if(data && data.responseData && data.responseData.translatedText) {
          translatedChunks.push(data.responseData.translatedText);
        } else {
          translatedChunks.push(chunk);
        }
        await new Promise(r => setTimeout(r, 200));
      }

      let finalTranslated = translatedChunks.join(' ');
      if(targetEl.tagName === 'TEXTAREA') {
        targetEl.value = finalTranslated;
      } else {
        targetEl.innerHTML = finalTranslated;
      }
      triggerFieldUpdates();
    } catch(err) {
      alert('Грешка при комуникација со преведувачот.');
    } finally {
      btn.innerText = origText;
      btn.disabled = false;
    }
  }

  async function saveFile(filePath, jsonData, msgId) {
    const token = localStorage.getItem('gh_token') || document.getElementById('gh-token').value.trim();
    const statusEl = document.getElementById(msgId);
    if(!token) { alert('Внесете токен најгоре!'); return; }

    triggerFieldUpdates();

    statusEl.style.display = 'block';
    statusEl.className = 'status loading';
    statusEl.innerText = '⏳ Се синхронизира со GitHub...';

    let payload = jsonData;
    if(filePath === 'content/blog.json') {
      payload = { posts: blogData };
    }

    try {
      const getRes = await fetch(`https://api.github.com/repos/${repo}/contents/${filePath}`, {
        headers: { 'Authorization': `token ${token}` }
      });
      let sha = getRes.ok ? (await getRes.json()).sha : '';

      const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload, null, 2))));
      const putRes = await fetch(`https://api.github.com/repos/${repo}/contents/${filePath}`, {
        method: 'PUT',
        headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: `Update ${filePath}`, content: contentBase64, sha: sha })
      });

      if(putRes.ok) {
        statusEl.className = 'status success';
        statusEl.innerText = '✓ Успешно зачувано и објавено!';
        setTimeout(() => statusEl.style.display = 'none', 4000);
      } else {
        statusEl.className = 'status error';
        statusEl.innerText = '✕ Грешка при зачувување.';
      }
    } catch(err) {
      statusEl.className = 'status error';
      statusEl.innerText = '✕ Мрежна грешка.';
    }
  }
</script>
