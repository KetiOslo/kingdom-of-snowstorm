<!DOCTYPE html>
<html lang="mk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kingdom of Snowstorm | Professional Admin</title>
  <style>
    :root { --primary: #0284c7; --primary-dark: #0369a1; --success: #16a34a; --bg: #f1f5f9; --card: #ffffff; --text: #1e293b; --border: #cbd5e1; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .wrapper { max-width: 1100px; margin: 0 auto; background: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
    h1 { color: var(--primary); font-size: 24px; margin-top: 0; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .auth-box { background: #f0f9ff; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #bae6fd; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .auth-box input { flex: 1; min-width: 250px; margin: 0; }
    .tabs { display: flex; gap: 6px; margin-bottom: 25px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; flex-wrap: wrap; }
    .tab-btn { background: #e2e8f0; border: none; padding: 9px 14px; font-weight: 600; border-radius: 6px; cursor: pointer; color: #475569; transition: all 0.2s; font-size: 13px; }
    .tab-btn.active { background: var(--primary); color: white; }
    .tab-content { display: none; animation: fadeIn 0.3s ease; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    label { font-weight: 600; display: block; margin-top: 15px; font-size: 14px; color: #475569; }
    input[type="text"], input[type="password"], input[type="date"], select { width: 100%; padding: 10px 12px; margin-top: 6px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1); }
    
    /* ВИДЛИВ И ПРОФЕСИОНАЛЕН EDITOR */
    .editor-wrapper { margin-top: 6px; border: 2px solid var(--border); border-radius: 8px; overflow: hidden; background: #fff; }
    .editor-toolbar { background: #e2e8f0; border-bottom: 1px solid var(--border); padding: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
    .editor-toolbar button { background: #ffffff; border: 1px solid #94a3b8; border-radius: 4px; padding: 6px 12px; font-weight: bold; cursor: pointer; color: #1e293b; font-size: 13px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .editor-toolbar button:hover { background: var(--primary); color: white; border-color: var(--primary); }
    .editor-content { min-height: 130px; max-height: 300px; overflow-y: auto; padding: 12px; outline: none; font-size: 14px; line-height: 1.6; background: #ffffff; color: #0f172a; }
    .editor-content:focus { background: #f8fafc; }

    .btn { background: var(--primary); color: white; border: none; padding: 12px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; margin-top: 20px; transition: background 0.2s; }
    .btn:hover { background: var(--primary-dark); }
    .btn-secondary { background: #10b981; }
    .btn-secondary:hover { background: #059669; }
    .item-card { background: #f8fafc; border: 1px solid var(--border); padding: 20px; border-radius: 8px; margin-bottom: 20px; position: relative; }
    .remove-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; position: absolute; top: 20px; right: 20px; font-size: 12px; font-weight: bold; }
    .remove-btn:hover { background: #dc2626; }
    .status { margin-top: 15px; font-weight: 600; font-size: 14px; padding: 10px; border-radius: 6px; display: none; }
    .status.success { background: #dcfce7; color: var(--success); display: block; }
    .status.error { background: #fee2e2; color: #ef4444; display: block; }
    .status.loading { background: #e0f2fe; color: var(--primary); display: block; }
    .file-upload-box { margin-top: 6px; background: #fff; padding: 10px; border: 1px dashed var(--border); border-radius: 6px; }
  </style>
</head>
<body>

<div class="wrapper">
  <h1>
    <span>👑 Kingdom of Snowstorm - Professional Admin</span>
    <span style="font-size: 13px; font-weight: normal; color: #64748b;">Уредувач на текст</span>
  </h1>
  
  <div class="auth-box">
    <div style="flex: 1; min-width: 250px;">
      <label style="margin-top: 0;">GitHub Personal Access Token:</label>
      <input type="password" id="gh-token" placeholder="ghp_..." onchange="saveToken()" />
    </div>
    <div style="margin-top: 20px;">
      <button class="btn" style="margin-top: 0; padding: 10px 15px;" onclick="saveToken()">Запомни токен</button>
    </div>
    <div id="auth-status" style="width: 100%; font-size: 13px; font-weight: 600; color: var(--success);"></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('home', event)">🏠 Почетна</button>
    <button class="tab-btn" onclick="switchTab('about', event)">📖 За нас</button>
    <button class="tab-btn" onclick="switchTab('settings', event)">⚙️ Поставки</button>
    <button class="tab-btn" onclick="switchTab('gallery', event)">📸 Галерија</button>
    <button class="tab-btn" onclick="switchTab('dogs', event)">🐶 Кучиња</button>
    <button class="tab-btn" onclick="switchTab('litters', event)">🍼 Легла (Litters)</button>
    <button class="tab-btn" onclick="switchTab('puppies', event)">🐾 Достапни</button>
    <button class="tab-btn" onclick="switchTab('blog', event)">📝 Блог</button>
  </div>

  <!-- 1. ПОЧЕТНА -->
  <div id="home" class="tab-content active">
    <h3>Уредување на Почетна страница</h3>
    <label>Главен наслов:</label><input type="text" id="h_title" />
    
    <label>Воведен текст:</label>
    <div class="editor-wrapper">
      <div class="editor-toolbar">
        <button type="button" onclick="formatText('h_desc', 'bold')"><b>B (Bold)</b></button>
        <button type="button" onclick="formatText('h_desc', 'italic')"><i>I (Italic)</i></button>
        <button type="button" onclick="formatText('h_desc', 'underline')"><u>U</u></button>
        <button type="button" onclick="formatText('h_desc', 'insertUnorderedList')">• Листа</button>
      </div>
      <div id="h_desc" class="editor-content" contenteditable="true"></div>
    </div>

    <label>Наслов на кутија:</label><input type="text" id="h_box_title" />
    
    <label>Опис на кутија:</label>
    <div class="editor-wrapper">
      <div class="editor-toolbar">
        <button type="button" onclick="formatText('h_box_desc', 'bold')"><b>B (Bold)</b></button>
        <button type="button" onclick="formatText('h_box_desc', 'italic')"><i>I (Italic)</i></button>
      </div>
      <div id="h_box_desc" class="editor-content" contenteditable="true"></div>
    </div>

    <button class="btn" onclick="saveFile('content/home.json', getHomeData(), 'home.msg')">Зачувај на GitHub</button>
    <div id="home.msg" class="status"></div>
  </div>

  <!-- 2. ЗА НАС -->
  <div id="about" class="tab-content">
    <h3>Уредување на За нас страница</h3>
    <label>Пасус 1:</label>
    <div class="editor-wrapper">
      <div class="editor-toolbar">
        <button type="button" onclick="formatText('a_p1', 'bold')"><b>B</b></button>
        <button type="button" onclick="formatText('a_p1', 'italic')"><i>I</i></button>
      </div>
      <div id="a_p1" class="editor-content" contenteditable="true"></div>
    </div>

    <label>Пасус 2:</label>
    <div class="editor-wrapper">
      <div class="editor-toolbar">
        <button type="button" onclick="formatText('a_p2', 'bold')"><b>B</b></button>
        <button type="button" onclick="formatText('a_p2', 'italic')"><i>I</i></button>
      </div>
      <div id="a_p2" class="editor-content" contenteditable="true"></div>
    </div>

    <label>Цитат:</label>
    <div class="editor-wrapper">
      <div class="editor-toolbar">
        <button type="button" onclick="formatText('a_quote', 'bold')"><b>B</b></button>
        <button type="button" onclick="formatText('a_quote', 'italic')"><i>I</i></button>
      </div>
      <div id="a_quote" class="editor-content" contenteditable="true"></div>
    </div>

    <button class="btn" onclick="saveFile('content/about.json', getAboutData(), 'about.msg')">Зачувај на GitHub</button>
    <div id="about.msg" class="status"></div>
  </div>

  <!-- 3. ПОСТАВКИ -->
  <div id="settings" class="tab-content">
    <h3>⚙️ Општи поставки</h3>
    <label>Локација:</label><input type="text" id="s_location" />
    <label>Телефон:</label><input type="text" id="s_phone" />
    <label>Е-пошта:</label><input type="text" id="s_email" />
    <label>Facebook Линк:</label><input type="text" id="s_fb" />
    <button class="btn" onclick="saveFile('content/settings.json', getSettingsData(), 'settings.msg')">Зачувај на GitHub</button>
    <div id="settings.msg" class="status"></div>
  </div>

  <!-- 4. ГАЛЕРИЈА -->
  <div id="gallery" class="tab-content">
    <h3>📸 Уредување на Галерија</h3>
    <div id="gallery-container"></div>
    <button class="btn btn-secondary" onclick="addGalleryItem()">+ Додај галерија ставка</button>
    <br><br>
    <button class="btn" onclick="saveFile('content/gallery.json', { items: galleryData }, 'gallery.msg')">Зачувај на GitHub</button>
    <div id="gallery.msg" class="status"></div>
  </div>

  <!-- 5. КУЧИЊА -->
  <div id="dogs" class="tab-content">
    <h3>🐶 Уредување на Кучиња</h3>
    <div id="dogs-container"></div>
    <button class="btn btn-secondary" onclick="addDogItem()">+ Додај ново куче</button>
    <br><br>
    <button class="btn" onclick="saveFile('content/dogs.json', { dogs: dogsData }, 'dogs.msg')">Зачувај на GitHub</button>
    <div id="dogs.msg" class="status"></div>
  </div>

  <!-- 6. ЛЕГЛА -->
  <div id="litters" class="tab-content">
    <h3>🍼 Уредување на Легла (Litters)</h3>
    <div id="litters-container"></div>
    <button class="btn btn-secondary" onclick="addLitterItem()">+ Додај ново легло</button>
    <br><br>
    <button class="btn" onclick="saveFile('content/litters.json', { litters: littersData }, 'litters.msg')">Зачувај на GitHub</button>
    <div id="litters.msg" class="status"></div>
  </div>

  <!-- 7. ДОСТАПНИ -->
  <div id="puppies" class="tab-content">
    <h3>🐾 Достапни кученца</h3>
    <div id="puppies-container"></div>
    <button class="btn btn-secondary" onclick="addPuppyItem()">+ Додај кученце</button>
    <br><br>
    <button class="btn" onclick="saveFile('content/puppies.json', { puppies: puppiesData }, 'puppies.msg')">Зачувај на GitHub</button>
    <div id="puppies.msg" class="status"></div>
  </div>

  <!-- 8. БЛОГ -->
  <div id="blog" class="tab-content">
    <h3>📝 Блог објави</h3>
    <div id="blog-container"></div>
    <button class="btn btn-secondary" onclick="addBlogPost()">+ Креирај нов блог пост</button>
    <br><br>
    <button class="btn" onclick="saveFile('content/blog.json', { posts: blogData }, 'blog.msg')">Зачувај на GitHub</button>
    <div id="blog.msg" class="status"></div>
  </div>

</div>

<script>
  let galleryData = [], dogsData = [], littersData = [], puppiesData = [], blogData = [];
  const repo = 'KetiOslo/kingdom-of-snowstorm';

  function saveToken() {
    const t = document.getElementById('gh-token').value.trim();
    if(t) { localStorage.setItem('gh_token', t); document.getElementById('auth-status').innerText = '✓ Токенот е зачуван!'; }
  }

  function formatText(containerId, command) {
    const el = document.getElementById(containerId);
    if(el) {
      el.focus();
      document.execCommand(command, false, null);
    }
  }

  window.addEventListener('DOMContentLoaded', async () => {
    const savedT = localStorage.getItem('gh_token');
    if(savedT) { document.getElementById('gh-token').value = savedT; document.getElementById('auth-status').innerText = '✓ Поврзано со GitHub.'; }

    try {
      const loadJSON = async (path, setter, renderFn) => {
        const res = await fetch(`../${path}?t=` + new Date().getTime());
        if(res.ok) { const d = await res.json(); setter(d); if(renderFn) renderFn(); }
      };

      const rH = await fetch('../content/home.json');
      if(rH.ok) {
        const d = await rH.json();
        document.getElementById('h_title').value = d.hero_title || '';
        document.getElementById('h_desc').innerHTML = d.hero_desc || '';
        document.getElementById('h_box_title').value = d.box_title || '';
        document.getElementById('h_box_desc').innerHTML = d.box_desc || '';
      }

      const rA = await fetch('../content/about.json');
      if(rA.ok) {
        const d = await rA.json();
        document.getElementById('a_p1').innerHTML = d.p1 || '';
        document.getElementById('a_p2').innerHTML = d.p2 || '';
        document.getElementById('a_quote').innerHTML = d.quote || '';
      }

      const rS = await fetch('../content/settings.json');
      if(rS.ok) {
        const d = await rS.json();
        document.getElementById('s_location').value = d.location || '';
        document.getElementById('s_phone').value = d.phone || '';
        document.getElementById('s_email').value = d.email || '';
        document.getElementById('s_fb').value = d.facebook_url || '';
      }

      await loadJSON('content/gallery.json', d => galleryData = d.items || [], renderGallery);
      await loadJSON('content/dogs.json', d => dogsData = d.dogs || d.items || [], renderDogs);
      await loadJSON('content/litters.json', d => littersData = d.litters || d.items || [], renderLitters);
      await loadJSON('content/puppies.json', d => puppiesData = d.puppies || d.items || [], renderPuppies);
      await loadJSON('content/blog.json', d => blogData = d.posts || d.items || [], renderBlog);
    } catch(e) { console.log("Init OK"); }
  });

  function switchTab(tabId, event) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    if(event) event.currentTarget.classList.add('active');
  }

  async function uploadMultipleImagesToGithub(fileInput, targetInputId, onComplete) {
    const files = fileInput.files;
    if(!files || files.length === 0) return;
    const token = localStorage.getItem('gh_token') || document.getElementById('gh-token').value.trim();
    if(!token) { alert('Внесете токен најгоре!'); return; }

    const box = fileInput.closest('.file-upload-box');
    let statusInfo = box.querySelector('.upload-status');
    if(!statusInfo) {
      statusInfo = document.createElement('div');
      statusInfo.className = 'upload-status';
      statusInfo.style.fontSize = '12px';
      statusInfo.style.color = '#0284c7';
      statusInfo.style.marginTop = '5px';
      box.appendChild(statusInfo);
    }
    statusInfo.innerText = `⏳ Се прикачуваат ${files.length} слика(и)...`;

    let uploadedPaths = [];
    const currentInputValue = document.getElementById(targetInputId).value.trim();
    if(currentInputValue) {
      uploadedPaths = currentInputValue.split(',').map(s => s.trim()).filter(Boolean);
    }

    try {
      for(let i = 0; i < files.length; i++) {
        const file = files[i];
        const base64Content = await toBase64(file);
        const fileName = Date.now() + '_' + i + '_' + file.name.replace(/\s+/g, '_');
        const filePath = `content/images/${fileName}`;

        const res = await fetch(`https://api.github.com/repos/${repo}/contents/${filePath}`, {
          method: 'PUT',
          headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: `Upload ${fileName}`, content: base64Content })
        });

        if(res.ok) {
          uploadedPaths.push(`content/images/${fileName}`);
        }
        await new Promise(r => setTimeout(r, 400));
      }

      const finalString = uploadedPaths.join(', ');
      document.getElementById(targetInputId).value = finalString;
      statusInfo.innerText = '✓ Сите слики се успешно поставени!';
      if(onComplete) onComplete(finalString);
    } catch(err) {
      statusInfo.innerText = '✕ Грешка при прикачување.';
      alert('✕ Грешка при прикачување на сликите.');
    }
  }

  function toBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = error => reject(error);
    });
  }

  function renderGallery() {
    const c = document.getElementById('gallery-container'); c.innerHTML = '';
    galleryData.forEach((item, i) => {
      c.innerHTML += `<div class="item-card">
        <button class="remove-btn" onclick="galleryData.splice(${i},1); renderGallery();">Избриши</button>
        <label>Наслов:</label><input type="text" value="${item.title || ''}" onchange="galleryData[${i}].title = this.value">
        <label>Категорија:</label>
        <select onchange="galleryData[${i}].category = this.value">
          <option value="Shows" ${item.category === 'Shows' ? 'selected' : ''}>Shows</option>
          <option value="Home Life" ${item.category === 'Home Life' ? 'selected' : ''}>Home Life</option>
          <option value="Puppies" ${item.category === 'Puppies' ? 'selected' : ''}>Puppies</option>
          <option value="Grooming" ${item.category === 'Grooming' ? 'selected' : ''}>Grooming</option>
        </select>
        <label>Фотографии (може повеќе разделени со запирка):</label><input type="text" id="gal_${i}" value="${item.image || ''}" onchange="galleryData[${i}].image = this.value">
        <div class="file-upload-box"><input type="file" accept="image/*" multiple onchange="uploadMultipleImagesToGithub(this, 'gal_${i}', (val) => { galleryData[${i}].image = val; });"></div>
        <label>Опис:</label>
        <div class="editor-wrapper">
          <div class="editor-toolbar">
            <button type="button" onclick="formatText('gal_desc_${i}', 'bold')"><b>B</b></button>
            <button type="button" onclick="formatText('gal_desc_${i}', 'italic')"><i>I</i></button>
          </div>
          <div id="gal_desc_${i}" class="editor-content" contenteditable="true" oninput="galleryData[${i}].caption = this.innerHTML">${item.caption || ''}</div>
        </div>
      </div>`;
    });
  }
  function addGalleryItem() { galleryData.push({ title: "", category: "Shows", image: "", caption: "" }); renderGallery(); }

  function renderDogs() {
    const c = document.getElementById('dogs-container'); c.innerHTML = '';
    dogsData.forEach((dog, i) => {
      c.innerHTML += `<div class="item-card">
        <button class="remove-btn" onclick="dogsData.splice(${i},1); renderDogs();">Избриши</button>
        <label>Име:</label><input type="text" value="${dog.name || ''}" onchange="dogsData[${i}].name = this.value">
        <label>Линија:</label><input type="text" value="${dog.lineage || ''}" onchange="dogsData[${i}].lineage = this.value">
        <label>Пол:</label><input type="text" value="${dog.gender || ''}" onchange="dogsData[${i}].gender = this.value">
        <label>Фотографии (може повеќе разделени со запирка):</label><input type="text" id="dog_${i}" value="${dog.image || ''}" onchange="dogsData[${i}].image = this.value">
        <div class="file-upload-box"><input type="file" accept="image/*" multiple onchange="uploadMultipleImagesToGithub(this, 'dog_${i}', (val) => { dogsData[${i}].image = val; });"></div>
        <label>Опис:</label>
        <div class="editor-wrapper">
          <div class="editor-toolbar">
            <button type="button" onclick="formatText('dog_desc_${i}', 'bold')"><b>B</b></button>
            <button type="button" onclick="formatText('dog_desc_${i}', 'italic')"><i>I</i></button>
          </div>
          <div id="dog_desc_${i}" class="editor-content" contenteditable="true" oninput="dogsData[${i}].narrative = this.innerHTML">${dog.narrative || ''}</div>
        </div>
      </div>`;
    });
  }
  function addDogItem() { dogsData.push({ name: "", lineage: "", gender: "", image: "", narrative: "" }); renderDogs(); }

  function renderLitters() {
    const c = document.getElementById('litters-container'); c.innerHTML = '';
    littersData.forEach((litter, i) => {
      c.innerHTML += `<div class="item-card">
        <button class="remove-btn" onclick="littersData.splice(${i},1); renderLitters();">Избриши</button>
        <label>Име на леглото:</label><input type="text" value="${litter.title || ''}" onchange="littersData[${i}].title = this.value">
        <label>Фотографии (може повеќе разделени со запирка):</label><input type="text" id="lit_${i}" value="${litter.image || ''}" onchange="littersData[${i}].image = this.value">
        <div class="file-upload-box"><input type="file" accept="image/*" multiple onchange="uploadMultipleImagesToGithub(this, 'lit_${i}', (val) => { littersData[${i}].image = val; });"></div>
        <label>Опис:</label>
        <div class="editor-wrapper">
          <div class="editor-toolbar">
            <button type="button" onclick="formatText('lit_desc_${i}', 'bold')"><b>B</b></button>
            <button type="button" onclick="formatText('lit_desc_${i}', 'italic')"><i>I</i></button>
          </div>
          <div id="lit_desc_${i}" class="editor-content" contenteditable="true" oninput="littersData[${i}].description = this.innerHTML">${litter.description || ''}</div>
        </div>
      </div>`;
    });
  }
  function addLitterItem() { littersData.push({ title: "", image: "", description: "" }); renderLitters(); }

  function renderPuppies() {
    const c = document.getElementById('puppies-container'); c.innerHTML = '';
    puppiesData.forEach((pup, i) => {
      c.innerHTML += `<div class="item-card">
        <button class="remove-btn" onclick="puppiesData.splice(${i},1); renderPuppies();">Избриши</button>
        <label>Име на кученцето:</label><input type="text" value="${pup.name || ''}" onchange="puppiesData[${i}].name = this.value">
        <label>Статус:</label><input type="text" value="${pup.status || ''}" onchange="puppiesData[${i}].status = this.value">
        <label>Фотографии (може повеќе разделени со запирка):</label><input type="text" id="pup_${i}" value="${pup.image || ''}" onchange="puppiesData[${i}].image = this.value">
        <div class="file-upload-box"><input type="file" accept="image/*" multiple onchange="uploadMultipleImagesToGithub(this, 'pup_${i}', (val) => { puppiesData[${i}].image = val; });"></div>
        <label>Детали:</label>
        <div class="editor-wrapper">
          <div class="editor-toolbar">
            <button type="button" onclick="formatText('pup_desc_${i}', 'bold')"><b>B</b></button>
            <button type="button" onclick="formatText('pup_desc_${i}', 'italic')"><i>I</i></button>
          </div>
          <div id="pup_desc_${i}" class="editor-content" contenteditable="true" oninput="puppiesData[${i}].details = this.innerHTML">${pup.details || ''}</div>
        </div>
      </div>`;
    });
  }
  function addPuppyItem() { puppiesData.push({ name: "", status: "Достапно / Available", image: "", details: "" }); renderPuppies(); }

  function renderBlog() {
    const c = document.getElementById('blog-container'); c.innerHTML = '';
    blogData.forEach((post, i) => {
      c.innerHTML += `<div class="item-card">
        <button class="remove-btn" onclick="blogData.splice(${i},1); renderBlog();">Избриши</button>
        <label>Наслов:</label><input type="text" value="${post.title || ''}" onchange="blogData[${i}].title = this.value">
        <label>Датум:</label><input type="date" value="${post.date || ''}" onchange="blogData[${i}].date = this.value" style="width:100%; padding:10px; margin-top:6px; border:1px solid var(--border); border-radius:6px;">
        <label>Фотографии (може повеќе разделени со запирка):</label><input type="text" id="blog_${i}" value="${post.image || ''}" onchange="blogData[${i}].image = this.value">
        <div class="file-upload-box"><input type="file" accept="image/*" multiple onchange="uploadMultipleImagesToGithub(this, 'blog_${i}', (val) => { blogData[${i}].image = val; });"></div>
        <label>Краток опис:</label>
        <div class="editor-wrapper">
          <div class="editor-toolbar">
            <button type="button" onclick="formatText('blog_exc_${i}', 'bold')"><b>B</b></button>
            <button type="button" onclick="formatText('blog_exc_${i}', 'italic')"><i>I</i></button>
          </div>
          <div id="blog_exc_${i}" class="editor-content" style="min-height:70px;" contenteditable="true" oninput="blogData[${i}].excerpt = this.innerHTML">${post.excerpt || ''}</div>
        </div>
        <label>Целосна содржина:</label>
        <div class="editor-wrapper">
          <div class="editor-toolbar">
            <button type="button" onclick="formatText('blog_cont_${i}', 'bold')"><b>B</b></button>
            <button type="button" onclick="formatText('blog_cont_${i}', 'italic')"><i>I</i></button>
            <button type="button" onclick="formatText('blog_cont_${i}', 'insertUnorderedList')">• Листа</button>
          </div>
          <div id="blog_cont_${i}" class="editor-content" contenteditable="true" oninput="blogData[${i}].content = this.innerHTML">${post.content || ''}</div>
        </div>
      </div>`;
    });
  }
  function addBlogPost() {
    const today = new Date().toISOString().split('T')[0];
    blogData.unshift({ title: "", date: today, image: "", excerpt: "", content: "" });
    renderBlog();
  }

  function getHomeData() {
    return {
      hero_title: document.getElementById('h_title').value,
      hero_desc: document.getElementById('h_desc').innerHTML,
      box_title: document.getElementById('h_box_title').value,
      box_desc: document.getElementById('h_box_desc').innerHTML
    };
  }
  function getAboutData() {
    return {
      p1: document.getElementById('a_p1').innerHTML,
      p2: document.getElementById('a_p2').innerHTML,
      quote: document.getElementById('a_quote').innerHTML
    };
  }
  function getSettingsData() {
    return {
      location: document.getElementById('s_location').value,
      phone: document.getElementById('s_phone').value,
      email: document.getElementById('s_email').value,
      facebook_url: document.getElementById('s_fb').value,
      footer_desc: "Lifetime with Labradors."
    };
  }

  async function saveFile(filePath, jsonData, msgId) {
    const token = localStorage.getItem('gh_token') || document.getElementById('gh-token').value.trim();
    const statusEl = document.getElementById(msgId);
    if(!token) { alert('Внесете токен најгоре!'); return; }

    statusEl.className = 'status loading';
    statusEl.innerText = '⏳ Се синхронизира со GitHub...';

    try {
      const getRes = await fetch(`https://api.github.com/repos/${repo}/contents/${filePath}`, {
        headers: { 'Authorization': `token ${token}` }
      });
      let sha = getRes.ok ? (await getRes.json()).sha : '';

      const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(jsonData, null, 2))));
      const putRes = await fetch(`https://api.github.com/repos/${repo}/contents/${filePath}`, {
        method: 'PUT',
        headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: `Update ${filePath}`, content: contentBase64, sha: sha })
      });

      if(putRes.ok) {
        statusEl.className = 'status success';
        statusEl.innerText = '✓ Успешно зачувано и објавено!';
        setTimeout(() => statusEl.style.display = 'none', 4000);
      } else {
        statusEl.className = 'status error';
        statusEl.innerText = '✕ Грешка при зачувување.';
      }
    } catch(err) {
      statusEl.className = 'status error';
      statusEl.innerText = '✕ Мрежна грешка.';
    }
  }
</script>
