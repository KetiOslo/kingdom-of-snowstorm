backend:
  name: github
  repo: KetiOslo/kingdom-of-snowstorm
  branch: main

media_folder: "images"
public_folder: "images"

collections:
  - name: "site_settings"
    label: "⚙️ Општи информации и контакти"
    files:
      - name: "general"
        label: "Контакти, Телефони и Футер"
        file: "content/settings.json"
        fields:
          - { label: "Телефон (WhatsApp & Viber)", name: "phone", widget: "string" }
          - { label: "Официјален Е-пошта", name: "email", widget: "string" }
          - { label: "Град и држава", name: "location", widget: "string" }
          - { label: "Фејсбук линк", name: "facebook_url", widget: "string" }
          - { label: "Опис во футерот", name: "footer_desc", widget: "text" }

  - name: "pages"
    label: "📄 Страници (Pages)"
    files:
      - name: "home"
        label: "🏠 Почетна (Home)"
        file: "content/home.json"
        fields:
          - { label: "Главен наслов", name: "hero_title", widget: "string" }
          - { label: "Поднаслов / Воведен текст", name: "hero_desc", widget: "text" }
          - { label: "FCI Стандард - Наслов", name: "box_title", widget: "string" }
          - { label: "FCI Стандард - Текст", name: "box_desc", widget: "text" }
          - { label: "Вредност 1 - Наслов", name: "val1_title", widget: "string" }
          - { label: "Вредност 1 - Текст", name: "val1_desc", widget: "text" }
          - { label: "Вредност 2 - Наслов", name: "val2_title", widget: "string" }
          - { label: "Вредност 2 - Текст", name: "val2_desc", widget: "text" }
          - { label: "Вредност 3 - Наслов", name: "val3_title", widget: "string" }
          - { label: "Вредност 3 - Текст", name: "val3_desc", widget: "text" }

      - name: "about"
        label: "📖 За нас (About Us)"
        file: "content/about.json"
        fields:
          - { label: "Пасус 1 (Катерина)", name: "p1", widget: "text" }
          - { label: "Пасус 2 (Hannah 2016)", name: "p2", widget: "text" }
          - { label: "Пасус 3 (Hannah 10 години)", name: "p3", widget: "text" }
          - { label: "Пасус 4 (Galla & Darla)", name: "p4", widget: "text" }
          - { label: "Пасус 5 (Oslo)", name: "p5", widget: "text" }
          - { label: "Цитат (Quote)", name: "quote", widget: "text" }

      - name: "available"
        label: "🐶 Достапни кучиња и Пакет (Available Dogs)"
        file: "content/available.json"
        fields:
          - { label: "Главен наслов на пакетот", name: "title", widget: "string" }
          - label: "Што е вклучено со секое кученце (Листа)"
            name: "inclusions"
            widget: "list"
            field: { label: "Ставка", name: "item", widget: "string" }

  - name: "dogs_section"
    label: "🐾 Нашите кучиња (Our Dogs)"
    files:
      - name: "dogs_list"
        label: "Листа на кучиња"
        file: "content/dogs.json"
        fields:
          - label: "Кучиња"
            name: "items"
            widget: "list"
            summary: "{{fields.name}} ({{fields.gender}})"
            fields:
              - { label: "Име", name: "name", widget: "string" }
              - { label: "Педигре / Родословие", name: "lineage", widget: "string" }
              - { label: "Пол", name: "gender", widget: "select", options: ["Мажјак", "Женка"] }
              - { label: "Возраст / Титули / Улога", name: "role", widget: "string" }
              - { label: "Биографија / Опис", name: "narrative", widget: "text" }
              - { label: "Слика", name: "image", widget: "image", required: false }

  - name: "litters_section"
    label: "🍼 Легла и Резервации (Litters)"
    files:
      - name: "litters_list"
        label: "Листа на легла"
        file: "content/litters.json"
        fields:
          - label: "Легла"
            name: "items"
            widget: "list"
            summary: "{{fields.pair}}"
            fields:
              - { label: "Парови / Наслов", name: "pair", widget: "string" }
              - { label: "Статус", name: "status", widget: "select", options: ["Отворени Резервации", "Планирано легло", "Сите се резервирани"] }
              - { label: "Опис и детали", name: "text", widget: "text" }

  - name: "gallery_section"
    label: "📸 Кенел Галерија (Kennel Gallery)"
    files:
      - name: "gallery"
        label: "Фотографии"
        file: "content/gallery.json"
        fields:
          - label: "Фотографии"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Наслов на фотографијата", name: "title", widget: "string" }
              - { label: "Слика", name: "image", widget: "image" }
              - { label: "Опис на сликата", name: "caption", widget: "string", required: false }
              - { label: "Категорија", name: "category", widget: "select", options: ["Изложби", "Домашен живот", "Кученца", "Груминг"], default: "Изложби" }

  - name: "blog_section"
    label: "📰 Блог и Совети (Blog)"
    files:
      - name: "blog_posts"
        label: "Објави и Совети"
        file: "content/blog.json"
        fields:
          - label: "Статии"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Наслов на статијата", name: "title", widget: "string" }
              - { label: "Ознака (на пр. НЕГА И ГРУМИНГ)", name: "tag", widget: "string" }
              - { label: "Целосен текст", name: "text", widget: "text" }
