backend:
  name: github
  repo: KetiOslo/kingdom-of-snowstorm
  branch: main

media_folder: "content/images"
public_folder: "content/images"

collections:
  - name: pages
    label: 📄 Страници (Pages)
    files:
      - name: home
        label: 🏠 Почетна
        file: "content/home.json"
        fields:
          - { label: "Главен наслов", name: "hero_title", widget: "string" }
          - { label: "Воведен текст", name: "hero_desc", widget: "text" }
          - { label: "Наслов на кутија", name: "box_title", widget: "string" }
          - { label: "Опис на кутија", name: "box_desc", widget: "text" }

      - name: about
        label: "📖 За нас (About Us)"
        file: "content/about.json"
        fields:
          - { label: "Пасус 1", name: "p1", widget: "text" }
          - { label: "Пасус 2", name: "p2", widget: "text" }
          - { label: "Цитат", name: "quote", widget: "text" }

      - name: settings
        label: "⚙️ Општи информации"
        file: "content/settings.json"
        fields:
          - { label: "Локација", name: "location", widget: "string" }
          - { label: "Телефон", name: "phone", widget: "string" }
          - { label: "Е-пошта", name: "email", widget: "string" }
